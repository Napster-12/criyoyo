<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | CRIYOYO</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#000;
            color:#fff;
        }

        .container{
            max-width:1200px;
            margin:auto;
            padding:0 20px;
        }

        /* NAVBAR */

        .nav{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:18px 0;
            border-bottom:1px solid #111;
            background:#000;
        }

        .logo{
            font-size:1.7rem;
            font-weight:700;
            color:#00ff88;
            letter-spacing:1px;
        }

        .nav-links{
            display:flex;
            gap:25px;
        }

        .nav-links a{
            text-decoration:none;
            color:#fff;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#00ff88;
        }

        .cart-link{
            text-decoration:none;
            color:#00ff88;
            font-weight:600;
        }

        @media(max-width:768px){
            .nav-links{
                display:none;
            }
        }

        /* CART SECTION */

        .cart-container{
            max-width:900px;
            margin:40px auto;
            padding:20px;
        }

        .cart-title{
            font-size:2rem;
            margin-bottom:10px;
        }

        .continue-shopping{
            color:#00ff88;
            text-decoration:none;
            font-size:0.95rem;
        }

        .cart-items{
            margin-top:30px;
        }

        .cart-item{
            display:flex;
            align-items:center;
            gap:20px;
            background:#0a0a0a;
            padding:15px;
            border:1px solid #111;
            border-radius:12px;
            margin-bottom:15px;
        }

        .cart-item img{
            width:90px;
            height:90px;
            object-fit:cover;
            border-radius:10px;
        }

        .item-details h3{
            margin-bottom:8px;
            font-size:1.1rem;
        }

        .price{
            color:#00ff88;
            font-weight:600;
        }

        .remove-btn{
            margin-left:auto;
        }

        .remove-btn button{
            background:red;
            color:#fff;
            border:none;
            padding:10px 16px;
            border-radius:6px;
            cursor:pointer;
            transition:0.3s;
        }

        .remove-btn button:hover{
            opacity:0.8;
        }

        .total-box{
            margin-top:30px;
            padding:20px;
            background:#0a0a0a;
            border:1px solid #111;
            border-radius:12px;
        }

        .total-box h2{
            margin-bottom:20px;
        }

        .email-input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#111;
            color:#fff;
            margin-bottom:15px;
            outline:none;
        }

        .checkout-btn{
            width:100%;
            background:#00ff88;
            color:#000;
            border:none;
            padding:15px;
            border-radius:8px;
            font-size:1rem;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
        }

        .checkout-btn:hover{
            background:#00cc6f;
        }

        .empty-cart{
            margin-top:30px;
            font-size:1.1rem;
            color:#aaa;
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <div class="container nav">

        <div class="logo">CRIYOYO</div>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/shop">Shop</a>
            <a href="/contact">Contact</a>
        </div>

        <a href="/cart" class="cart-link">🛒 Cart</a>

    </div>

    <!-- CART -->

    <div class="cart-container">

        <h1 class="cart-title">Your Cart</h1>

        <a href="/shop" class="continue-shopping">
            ← Continue Shopping
        </a>

        {% if items %}

        <div class="cart-items">

            {% for item in items %}

            <div class="cart-item">

                <img src="{{ item.image }}" alt="{{ item.name }}">

                <div class="item-details">
                    <h3>{{ item.name }}</h3>
                    <p class="price">R{{ item.price }}</p>
                </div>

                <div class="remove-btn">
                    <a href="/remove_from_cart/{{ loop.index0 }}">
                        <button>Remove</button>
                    </a>
                </div>

            </div>

            {% endfor %}

        </div>

        <!-- TOTAL + CHECKOUT -->

        <div class="total-box">

            <h2>Total: R{{ total }}</h2>

            <form method="POST" action="/checkout">

                <input 
                    type="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
                    class="email-input"
                >

                <button type="submit" class="checkout-btn">
                    Proceed to Checkout
                </button>

            </form>

        </div>

        {% else %}

        <p class="empty-cart">
            Your cart is empty.
        </p>

        {% endif %}

    </div>

</body>
</html>

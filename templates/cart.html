<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Your Cart | CRIYOYO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

/* NAVBAR */
.navbar{
    background:#000;
    border-bottom:1px solid #111;
    position:sticky;
    top:0;
    z-index:999;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
}

/* LOGO */
.logo{
    font-size:1.5rem;
    font-weight:700;
    color:#00ff88;
    text-decoration:none;
}

/* DESKTOP LINKS */
.nav-links{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:0.95rem;
    transition:0.3s;
}

.nav-links a:hover{
    color:#00ff88;
}

/* CART BUTTON */
.cart-btn{
    background:#00ff88;
    color:#000 !important;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
}

/* CART BUTTON */
.cart-btn{
    background:#00ff88;
    color:#000 !important;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.cart-count{
    background:#fff;
    color:#000;
    border-radius:50%;
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.7rem;
    font-weight:700;
}

/* HAMBURGER */
.hamburger{
    display:none;
    font-size:1.8rem;
    cursor:pointer;
    color:#00ff88;
}

/* MOBILE MENU */
.mobile-menu{
    display:none;
    flex-direction:column;
    gap:15px;
    padding:15px 0;
    border-top:1px solid #111;
}

.mobile-menu a{
    color:#fff;
    text-decoration:none;
    font-size:1.05rem;
}

.mobile-menu a:hover{
    color:#00ff88;
}

.mobile-menu .cart-btn{
    width:100%;
    text-align:center;
}

/* CART SECTION */
.cart-section{
    padding:70px 20px;
}

.cart-container{
    max-width:950px;
    margin:auto;
}

.cart-title{
    font-size:2.3rem;
    margin-bottom:10px;
}

.continue-shopping{
    color:#00ff88;
    text-decoration:none;
    font-size:0.95rem;
}

/* CART ITEMS */
.cart-items{
    margin-top:35px;
}

.cart-item{
    display:flex;
    align-items:center;
    gap:20px;
    background:#0a0a0a;
    padding:18px;
    border:1px solid #111;
    border-radius:14px;
    margin-bottom:18px;
    transition:0.3s;
}

.cart-item:hover{
    border-color:#00ff88;
}

.cart-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:10px;
}

.item-details{
    flex:1;
}

.item-details h3{
    margin-bottom:8px;
    font-size:1.1rem;
}

.price{
    color:#00ff88;
    font-weight:600;
    font-size:1rem;
}

/* REMOVE BUTTON */
.remove-btn a{
    text-decoration:none;
}

.remove-btn button{
    background:#ff3b3b;
    color:#fff;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-weight:600;
    transition:0.3s;
}

.remove-btn button:hover{
    opacity:0.85;
}

/* TOTAL BOX */
.total-box{
    margin-top:35px;
    padding:25px;
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:14px;
}

.total-box h2{
    margin-bottom:20px;
    font-size:1.8rem;
}

/* EMAIL INPUT */
.email-input{
    width:100%;
    padding:15px;
    border:1px solid #222;
    border-radius:8px;
    background:#111;
    color:#fff;
    margin-bottom:15px;
    outline:none;
    transition:0.3s;
    font-size:0.95rem;
}

.email-input:focus{
    border-color:#00ff88;
}

/* CHECKOUT BUTTON */
.checkout-btn{
    width:100%;
    background:#00ff88;
    color:#000;
    border:none;
    padding:15px;
    border-radius:8px;
    font-size:1rem;
    font-weight:700;
    cursor:pointer;
    transition:0.3s;
}

.checkout-btn:hover{
    background:#00cc6f;
}

/* EMPTY CART */
.empty-cart{
    margin-top:30px;
    color:#888;
    font-size:1.05rem;
}

/* FOOTER */
footer{
    border-top:1px solid #111;
    padding:30px 20px;
    text-align:center;
    color:#777;
    margin-top:60px;
}

/* MOBILE */
@media screen and (max-width:768px){

    .nav-links{
        display:none;
    }

    .hamburger{
        display:block;
    }

    .mobile-menu.active{
        display:flex;
    }

    .cart-section{
        padding:50px 15px;
    }

    .cart-title{
        font-size:2rem;
    }

    .cart-item{
        flex-direction:column;
        align-items:flex-start;
    }

    .cart-item img{
        width:100%;
        height:240px;
    }

    .remove-btn{
        width:100%;
    }

    .remove-btn button{
        width:100%;
    }

    .total-box{
        padding:20px;
    }
}

</style>
</head>

<body>

{% include 'partials/navbar.html' %}

<!-- CART SECTION -->
<section class="cart-section">

    <div class="cart-container">

        <h1 class="cart-title">Your Cart</h1>

        <a href="/shop" class="continue-shopping">
            ← Continue Shopping
        </a>

        {% if items %}

        <div class="cart-items">

            {% for item in items %}

            <div class="cart-item">

                <img src="{{ item.image }}" alt="{{ item.name }}">

                <div class="item-details">
                    <h3>{{ item.name }}</h3>
                    <p class="price">R{{ item.price }}</p>
                </div>

                <div class="remove-btn">
                    <a href="/remove_from_cart/{{ loop.index0 }}">
                        <button>
                            Remove
                        </button>
                    </a>
                </div>

            </div>

            {% endfor %}

        </div>

            <!-- Total -->
            <div class="total-box">

                <h2>Total: R{{ total }}</h2>

                <a href="/checkout" style="text-decoration: none;">
                    <button type="button" class="checkout-btn">
                        Proceed to Checkout
                    </button>
                </a>

            </div>

        {% else %}

        <p class="empty-cart">
            Your cart is empty.
        </p>

        {% endif %}

    </div>

</section>

<!-- FOOTER -->
<footer>
    © 2026 Criyoyo Clothing. All rights reserved.
</footer>

<!-- SCRIPT -->
<script>

function toggleMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}

</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Shop - Criyoyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:#000;color:#fff}
        .container{max-width:1200px;margin:auto;padding:0 20px}
        .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #111;background:#000}
        .logo{font-weight:700;font-size:1.5rem;color:#00ff88}
        .nav-links{display:flex;gap:20px;font-size:0.9rem}
        .nav-links a{text-decoration:none;color:#fff}
        .nav-icons{display:flex;gap:15px;font-size:1.2rem;color:#00ff88}
        @media(max-width:768px){.nav-links{display:none}}
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="container nav">
  <div class="logo">CRIYOYO</div>
  <div class="nav-links">
    <a href="/">Home</a>
    <a href="/shop">Shop</a>
    <a href="#">Collections</a>
    <a href="/contact">Contact</a>
  </div>
  <a href="/cart">🛒 Cart</a>
</div>

<div style="padding:20px">
    <h1>Shop All Products</h1>

    <a href="/" style="color:#00ff88">← Back to Home</a>

     <div style="
         display:grid;
         grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
         gap:20px;
         margin-top:20px;
     ">
 
     {% for product in products %}
         <div style="
             border:1px solid #00ff88;
             border-radius:10px;
             overflow:hidden;
             background:#0a0a0a;
             transition:0.3s;
         ">
             <img src="{{ product.image }}" style="width:100%; height:200px; object-fit:cover;">
             <div style="padding:15px; text-align:left;">
                 <h3>{{ product.name }}</h3>
                 <p style="color:#00ff88; font-weight:600; margin-bottom:10px;">R{{ product.price }}</p>
                 <a href="/add_to_cart/{{ product.id }}">
                     <button style="
                         width:100%;
                         padding:10px;
                         border:none;
                         background:#00ff88;
                         color:#000;
                         border-radius:5px;
                         cursor:pointer;
                         font-weight:600;
                     ">Add to Cart</button>
                 </a>
             </div>
         </div>
     {% endfor %}
 
     </div>
</div>

</body>
</html>

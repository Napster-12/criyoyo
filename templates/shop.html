<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Criyoyo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

/* NAVBAR */
.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
    border-bottom:1px solid #111;
    background:#000;
    gap:20px;
    flex-wrap:wrap;
}

.logo{
    font-weight:700;
    font-size:1.5rem;
    color:#00ff88;
    text-decoration:none;
}

.nav-links{
    display:flex;
    gap:20px;
}

.nav-links a{
    text-decoration:none;
    color:#fff;
    font-size:0.95rem;
    transition:0.3s;
}

.nav-links a:hover{
    color:#00ff88;
}

.cart{
    color:#00ff88;
    text-decoration:none;
    font-weight:600;
}

/* HEADER */
.header{
    padding:25px 0;
}

.header h1{
    font-size:2rem;
    margin-bottom:10px;
}

.back{
    color:#00ff88;
    text-decoration:none;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-top:20px;
}

/* CARD */
.card{
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    border-color:#00ff88;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:cover;
}

.card-body{
    padding:15px;
}

.card h3{
    font-size:1rem;
    margin-bottom:8px;
}

.price{
    color:#00ff88;
    font-weight:600;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:10px;
    border:none;
    background:#00ff88;
    color:#000;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    background:#00cc6a;
}

/* MOBILE */
@media screen and (max-width:768px){

    .nav{
        flex-direction:column;
        align-items:flex-start;
    }

    .nav-links{
        flex-direction:column;
        width:100%;
        gap:10px;
    }

    .nav-links a{
        padding:5px 0;
    }

    .header h1{
        font-size:1.6rem;
    }

    .grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="container nav">

    <div class="logo">CRIYOYO</div>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/contact">Contact</a>
        <a href="#">Collections</a>
    </div>

    <a href="/cart" class="cart">🛒 Cart</a>

</div>

<!-- HEADER -->
<div class="container header">

    <h1>Shop All Products</h1>

    <a href="/" class="back">← Back to Home</a>

</div>

<!-- PRODUCTS -->
<div class="container">

    <div class="grid">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">

            <div class="card-body">

                <h3>{{ product.name }}</h3>

                <div class="price">
                    R{{ product.price }}
                </div>

                <a href="/add_to_cart/{{ product.id }}">
                    <button class="btn">
                        Add to Cart
                    </button>
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>

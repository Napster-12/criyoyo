<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Criyoyo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

/* NAVBAR */
.navbar{
    background:#000;
    border-bottom:1px solid #111;
    position:sticky;
    top:0;
    z-index:999;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
}

/* LOGO */
.logo{
    font-size:1.5rem;
    font-weight:700;
    color:#00ff88;
    text-decoration:none;
}

/* LINKS (DESKTOP) */
.nav-links{
    display:flex;
    gap:20px;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:0.95rem;
}

.nav-links a:hover{
    color:#00ff88;
}

/* CART */
.cart{
    color:#00ff88;
    text-decoration:none;
    font-weight:600;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.cart-count{
    background:#fff;
    color:#000;
    border-radius:50%;
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.7rem;
    font-weight:700;
}

.cart-btn{
    background:#00ff88;
    color:#000 !important;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.cart-btn .cart-count{
    background:#fff;
}

/* HAMBURGER */
.hamburger{
    display:none;
    font-size:1.8rem;
    cursor:pointer;
    color:#00ff88;
}

/* MOBILE MENU */
.mobile-menu{
    display:none;
    flex-direction:column;
    gap:15px;
    padding:15px 0;
    border-top:1px solid #111;
}

.mobile-menu a{
    color:#fff;
    text-decoration:none;
    font-size:1.1rem;
}

.mobile-menu a:hover{
    color:#00ff88;
}

/* HEADER */
.header{
    padding:25px 0;
}

.header h1{
    font-size:2rem;
    margin-bottom:10px;
}

.back{
    color:#00ff88;
    text-decoration:none;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-top:20px;
}

/* CARD */
.card{
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
    display:flex;
    flex-direction:column;
}

.card:hover{
    border-color:#00ff88;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:#111;
}

.card-body{
    padding:15px;
    flex:1;
    display:flex;
    flex-direction:column;
}

.card h3{
    font-size:1rem;
    margin-bottom:8px;
}

.price{
    color:#00ff88;
    font-weight:600;
    margin-bottom:12px;
}

.btn{
    width:100%;
    padding:10px;
    border:none;
    background:#00ff88;
    color:#000;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
    margin-top:auto;
}

/* MOBILE */
@media screen and (max-width:768px){

    .nav-links,
    .cart{
        display:none;
    }

    .hamburger{
        display:block;
    }

    .mobile-menu.active{
        display:flex;
    }

    .header h1{
        font-size:1.6rem;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .card img{
        height:200px;
    }
}

</style>
</head>

<body>

{% include 'partials/navbar.html' %}

<!-- HEADER -->
<div class="container header">

    <h1>Shop All Products</h1>

   

</div>

<!-- PRODUCTS -->
<div class="container">

    <div class="grid">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">

            <div class="card-body">

                <h3>{{ product.name }}</h3>

                <div class="price">R{{ product.price }}</div>

                <a href="/add_to_cart/{{ product.id }}">
                    <button class="btn">Add to Cart</button>
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<!-- SCRIPT -->
<script>
function toggleMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>

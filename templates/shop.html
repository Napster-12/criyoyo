<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop - Criyoyo</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

/* CONTAINER */
.container{
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

/* HEADER */
.header{
    padding:25px 0;
}

.header h1{
    font-size:2rem;
}

/* GRID */
.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:20px;
    margin-top:20px;
}

/* CARD */
.card{
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
    display:flex;
    flex-direction:column;
}

.card:hover{
    border-color:#00ff88;
    transform:translateY(-5px);
}

.card img{
    width:100%;
    height:220px;
    object-fit:contain;
    background:#111;
}

.card-body{
    padding:15px;
    flex:1;
    display:flex;
    flex-direction:column;
}

.price{
    color:#00ff88;
    font-weight:600;
    margin:10px 0;
}

.btn{
    width:100%;
    padding:10px;
    border:none;
    background:#00ff88;
    color:#000;
    border-radius:6px;
    font-weight:600;
    cursor:pointer;
    margin-top:auto;
}

/* FLOATING CART */
.floating-cart{
    position:fixed;
    bottom:25px;
    right:20px;
    background:#00ff88;
    color:#000;
    width:60px;
    height:60px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:1.4rem;
    text-decoration:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.4);
    z-index:9999;
    transition:0.3s;
}

.floating-cart:hover{
    transform:scale(1.1);
}

.floating-cart .cart-count{
    position:absolute;
    top:5px;
    right:5px;
    background:#000;
    color:#00ff88;
    width:20px;
    height:20px;
    border-radius:50%;
    font-size:0.75rem;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
}

/* MOBILE */
@media screen and (max-width:768px){

    .grid{
        grid-template-columns:1fr;
    }

    .card img{
        height:200px;
    }

    .floating-cart{
        width:55px;
        height:55px;
        bottom:15px;
        right:15px;
        font-size:1.2rem;
    }
}

</style>
</head>

<body>

{% include 'partials/navbar.html' %}

<!-- HEADER -->
<div class="container header">
    <h1>Shop All Products</h1>
</div>

<!-- PRODUCTS -->
<div class="container">

    <div class="grid">

        {% for product in products %}

        <div class="card">

            <img src="{{ product.image }}" alt="{{ product.name }}">

            <div class="card-body">

                <h3>{{ product.name }}</h3>

                <div class="price">R{{ product.price }}</div>

                <a href="/add_to_cart/{{ product.id }}">
                    <button class="btn">Add to Cart</button>
                </a>

            </div>

        </div>

        {% endfor %}

    </div>

</div>

<!-- FLOATING CART -->
<a href="/cart" class="floating-cart">
    🛒 <span class="cart-count">{{ cart_count }}</span>
</a>

</body>
</html>

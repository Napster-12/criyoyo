<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Criyoyo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
        body{background:#000;color:#fff}

        /* NAVBAR */
        .navbar{background:#000;border-bottom:1px solid #111;position:sticky;top:0;z-index:999;padding:0 20px}
        .nav{display:flex;justify-content:space-between;align-items:center;padding:15px 0;max-width:1200px;margin:auto}
        .logo{font-size:1.5rem;font-weight:700;color:#00ff88;text-decoration:none}
        .nav-links{display:flex;gap:20px;align-items:center}
        .nav-links a{color:#fff;text-decoration:none;font-size:0.95rem;transition:0.3s}
        .nav-links a:hover{color:#00ff88}
        .cart-btn{background:#00ff88;color:#000 !important;padding:10px 16px;border-radius:6px;font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
        .cart-count{background:#fff;color:#000;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:0.7rem;font-weight:700}
        .hamburger{display:none;font-size:1.8rem;cursor:pointer;color:#00ff88}
        .mobile-menu{display:none;flex-direction:column;gap:15px;padding:15px 0;border-top:1px solid #111}
        .mobile-menu a{color:#fff;text-decoration:none;font-size:1.05rem}
        .mobile-menu a:hover{color:#00ff88}
        .mobile-menu .cart-btn{width:100%;text-align:center}

        .container{max-width:800px;margin:auto;padding:20px}
        
        /* CHECKOUT FORM */
        .checkout-form{background:#0a0a0a;border:1px solid #00ff88;border-radius:10px;padding:30px;margin-top:30px}
        .checkout-form h2{text-align:center;margin-bottom:25px;color:#00ff88}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;margin-bottom:8px;font-weight:600;color:#00ff88}
        .form-group input,
        .form-group select,
        .form-group textarea{
            width:100%;padding:12px;background:#111;border:1px solid #333;
            border-radius:5px;color:#fff;font-size:1rem
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus{
            outline:none;border-color:#00ff88;box-shadow:0 0 5px rgba(0,255,136,0.3)
        }
         .size-options{display:flex;gap:15px;margin-top:10px}
         .size-option{
             flex:1;padding:12px;background:#111;border:1px solid #333;
             border-radius:5px;color:#fff;text-align:center;
             cursor:pointer;transition:0.3s
         }
         .size-option:hover{border-color:#00ff88;background:#1a1a1a}
         .size-option.active{
             border-color:#00ff88;background:#00ff88;color:#000
         }
         .color-options{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
         .color-option{
             padding:10px 18px;background:#111;border:1px solid #333;
             border-radius:5px;color:#fff;cursor:pointer;transition:0.3s;
             min-width:60px;text-align:center
         }
         .color-option:hover{border-color:#00ff88;background:#1a1a1a}
         .color-option.active{
             border-color:#00ff88;background:#00ff88;color:#000
         }
        .delivery-options{display:flex;flex-direction:column;gap:10px;margin-top:10px}
        .delivery-option{
            padding:15px;background:#111;border:1px solid #333;
            border-radius:5px;color:#fff;cursor:pointer;transition:0.3s
        }
        .delivery-option:hover{border-color:#00ff88;background:#1a1a1a}
        .delivery-option.active{
            border-color:#00ff88;background:#00ff88;color:#000
        }
        .delivery-option input{margin-right:10px}
        .btn-primary{
            width:100%;padding:15px;background:#00ff88;color:#000;
            border:none;border-radius:5px;font-size:1.1rem;
            font-weight:600;cursor:pointer;transition:0.3s
        }
        .btn-primary:hover{background:#00cc6a}
        .order-summary{background:#0a0a0a;border:1px solid #00ff88;border-radius:10px;padding:20px;margin-top:30px}
        .order-summary h2{text-align:center;margin-bottom:20px;color:#00ff88}
        .order-item{
            display:flex;justify-content:space-between;padding:12px 0;
            border-bottom:1px solid #222
        }
        .order-total{
            font-size:1.3rem;color:#00ff88;font-weight:700;
            margin-top:20px;padding-top:15px;border-top:1px solid #333;
            text-align:right
        }
        .back-link{
            display:inline-block;color:#00ff88;margin-bottom:20px;
            text-decoration:none
        }
        
        @media(max-width:600px){
            .size-options{flex-direction:column}
            .delivery-options{flex-direction:column}
        }
    </style>
</head>
<body>


    <div class="container">
        <a href="/cart" class="back-link">← Back to Cart</a>
        
        <div class="checkout-form">
            <h2>Checkout</h2>
            <form method="POST" action="/checkout">
                 <!-- Customer Information -->
                 <div class="form-group">
                     <label for="email">Email Address *</label>
                     <input type="email" id="email" name="email" required>
                 </div>
                 
                 <div class="form-group">
                     <label for="phone">Phone Number *</label>
                     <input type="tel" id="phone" name="phone" required placeholder="+27 12 345 6789">
                 </div>
                 
                 <div class="form-group">
                     <label for="address">PEP Paxi Drop-off Point Address *</label>
                     <textarea id="address" name="address" rows="3" required placeholder="Enter the PEP store or Paxi drop-off point address (we deliver to your selected PEP/Paxi location)"></textarea>
                 </div>
                
                <!-- Size Selection (will be populated via JavaScript) -->
                <div class="form-group">
                    <label>Size Selection</label>
                    <div id="size-selection">
                        <!-- Size options will be dynamically generated here -->
                    </div>
                </div>
                
                <!-- Delivery Type -->
                <div class="form-group">
                    <label>PAXI Courier Delivery</label>
                    <p style="color: #888; font-size: 0.9rem; margin-bottom: 15px;">
                        We deliver to any PEP store or Paxi drop-off point across South Africa.
                    </p>
                    <div class="delivery-options">
                        <label class="delivery-option">
                            <input type="radio" name="delivery_type" value="3-5" checked>
                            3-5 Business Days (Standard) - R109.95
                        </label>
                        <label class="delivery-option">
                            <input type="radio" name="delivery_type" value="7-9">
                            7-9 Business Days (Economy) - R59.95
                        </label>
                    </div>
                </div>
                
                <button type="submit" class="btn-primary">Place Order</button>
            </form>
        </div>
        
        <!-- Order Summary -->
        <div class="order-summary">
            <h2>Order Summary</h2>
            <div id="order-items">
                {% for item in items %}
                <div class="order-item">
                    <span>{{ item.name }}</span>
                    <span>R{{ item.price }}</span>
                </div>
                {% endfor %}
            </div>
            <div class="order-total">
                Subtotal: R{{ total }}<br>
                Delivery: R<span id="delivery-cost">0</span><br>
                <strong>Total: R<span id="grand-total">{{ total }}</span></strong>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Delivery pricing
            const deliveryPrices = {
                '3-5': 109.95,  // PAXI 3-5 Business Days (Premium)
                '7-9': 59.95    // PAXI 7-9 Business Days (Economy)
            };

            const cartItems = [
                {% for item in items %}
                {
                    id: {{ item.id }},
                    name: "{{ item.name }}",
                    price: {{ item.price }},
                    image: "{{ item.image }}"
                }{% if not loop.last %},{% endif %}
                {% endfor %}
            ];

            const subtotal = {{ total }};

                 const sizeSelection = document.getElementById('size-selection');
                 const deliveryCostSpan = document.getElementById('delivery-cost');
                 const grandTotalSpan = document.getElementById('grand-total');

                 // Generate size and color selection for each item
                 cartItems.forEach((item) => {
                     const itemGroup = document.createElement('div');
                     itemGroup.innerHTML = `
                         <div class="form-group">
                             <label>${item.name} Size:</label>
                             <div class="size-options">
                                 <label class="size-option">S</label>
                                 <label class="size-option">M</label>
                                 <label class="size-option">L</label>
                                 <label class="size-option">XL</label>
                                 <label class="size-option">XXL</label>
                             </div>
                             <input type="hidden" name="size_${item.id}" value="M" required>
                         </div>
                         
                         <div class="form-group">
                             <label>${item.name} Color:</label>
                             <div class="color-options">
                                 <label class="color-option" data-color="Black">Black</label>
                                 <label class="color-option" data-color="White">White</label>
                                 <label class="color-option" data-color="Navy">Navy</label>
                                 <label class="color-option" data-color="Gray">Gray</label>
                             </div>
                             <input type="hidden" name="color_${item.id}" value="Black" required>
                         </div>
                     `;

                      const sizeOptions = itemGroup.querySelectorAll('.size-option');
                      sizeOptions.forEach(option => {
                          option.addEventListener('click', function() {
                              sizeOptions.forEach(opt => opt.classList.remove('active'));
                              this.classList.add('active');
                              itemGroup.querySelector(`input[type="hidden"][name="size_${item.id}"]`).value = this.textContent;
                          });

                          if (option.textContent === 'M') {
                              option.classList.add('active');
                          }
                      });

                      const colorOptions = itemGroup.querySelectorAll('.color-option');
                      colorOptions.forEach(option => {
                          option.addEventListener('click', function() {
                              colorOptions.forEach(opt => opt.classList.remove('active'));
                              this.classList.add('active');
                              itemGroup.querySelector(`input[type="hidden"][name="color_${item.id}"]`).value = this.getAttribute('data-color');
                          });

                          if (option.getAttribute('data-color') === 'Black') {
                              option.classList.add('active');
                          }
                      });

                     sizeSelection.appendChild(itemGroup);
                 });

            // Delivery type change handler
            const deliveryRadios = document.querySelectorAll('input[name="delivery_type"]');
            deliveryRadios.forEach(radio => {
                radio.addEventListener('change', function() {
                    const selectedDelivery = this.value;
                    const deliveryCost = deliveryPrices[selectedDelivery] || 0;
                    const grandTotal = subtotal + deliveryCost;

                    deliveryCostSpan.textContent = `${deliveryCost.toFixed(2)}`;
                    grandTotalSpan.textContent = `${grandTotal.toFixed(2)}`;
                });
            });

            // Initialize with default (3-5 days)
            const defaultDelivery = document.querySelector('input[name="delivery_type"]:checked').value;
            const initialDeliveryCost = deliveryPrices[defaultDelivery] || 0;
            deliveryCostSpan.textContent = `${initialDeliveryCost.toFixed(2)}`;
            grandTotalSpan.textContent = `${(subtotal + initialDeliveryCost).toFixed(2)}`;
        });
    </script>
</body>
</html>

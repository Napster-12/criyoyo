<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | CRIYOYO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

/* CONTAINER */
.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

/* NAVBAR */
.navbar{
    background:#000;
    border-bottom:1px solid #111;
    position:sticky;
    top:0;
    z-index:999;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
}

/* LOGO */
.logo{
    font-size:1.5rem;
    font-weight:700;
    color:#00ff88;
    text-decoration:none;
}

/* DESKTOP LINKS */
.nav-links{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:0.95rem;
    transition:0.3s;
}

.nav-links a:hover{
    color:#00ff88;
}

/* HAMBURGER */
.hamburger{
    display:none;
    font-size:1.8rem;
    cursor:pointer;
    color:#00ff88;
}

/* MOBILE MENU */
.mobile-menu{
    display:none;
    flex-direction:column;
    gap:15px;
    padding:15px 0;
    border-top:1px solid #111;
}

.mobile-menu a{
    color:#fff;
    text-decoration:none;
    font-size:1.05rem;
}

.mobile-menu a:hover{
    color:#00ff88;
}

/* LOGIN SECTION */
.login-section{
    min-height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
}

/* LOGIN CARD */
.login-card{
    width:100%;
    max-width:450px;
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:18px;
    padding:40px;
    transition:0.3s;
}

.login-card:hover{
    border-color:#00ff88;
    box-shadow:0 10px 30px rgba(0,255,136,0.08);
}

.login-card h1{
    font-size:2rem;
    margin-bottom:10px;
}

.login-card p{
    color:#aaa;
    margin-bottom:30px;
    line-height:1.6;
}

/* FORM */
.form-group{
    margin-bottom:18px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#ccc;
    font-size:0.95rem;
}

.form-control{
    width:100%;
    padding:14px;
    background:#111;
    border:1px solid #222;
    border-radius:8px;
    color:#fff;
    outline:none;
    transition:0.3s;
    font-size:0.95rem;
}

.form-control:focus{
    border-color:#00ff88;
}

/* BUTTON */
.submit-btn{
    width:100%;
    padding:14px;
    background:#00ff88;
    border:none;
    border-radius:8px;
    color:#000;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:0.3s;
}

.submit-btn:hover{
    background:#00cc6a;
}

/* ERROR */
.error-message{
    background:rgba(255,0,0,0.1);
    border:1px solid red;
    color:#ff6b6b;
    padding:14px;
    border-radius:8px;
    margin-bottom:20px;
}

/* MOBILE */
@media screen and (max-width:768px){

    .nav-links{
        display:none;
    }

    .hamburger{
        display:block;
    }

    .mobile-menu.active{
        display:flex;
    }

    .login-section{
        padding:40px 15px;
    }

    .login-card{
        padding:28px;
    }

    .login-card h1{
        font-size:1.8rem;
    }
}

</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="container nav">

        <a href="/" class="logo">CRIYOYO</a>

        <!-- DESKTOP -->
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/shop">Shop</a>
            <a href="/contact">Contact</a>
        </div>

        <!-- HAMBURGER -->
        <div class="hamburger" onclick="toggleMenu()">
            ☰
        </div>

    </div>

    <!-- MOBILE MENU -->
    <div class="container mobile-menu" id="mobileMenu">
        <a href="/">Home</a>
        <a href="/shop">Shop</a>
        <a href="/contact">Contact</a>
    </div>

</div>

<!-- LOGIN -->
<section class="login-section">

    <div class="login-card">

        <h1>Admin Login</h1>

        <p>
            Welcome Admin, enter your login credentials
            to access the dashboard.
        </p>

        {% if error %}
        <div class="error-message">
            {{ error }}
        </div>
        {% endif %}

        <form method="POST">

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" class="form-control" placeholder="Enter email" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter password" required>
            </div>

            <button type="submit" class="submit-btn">
                Login
            </button>

        </form>

    </div>

</section>

<!-- SCRIPT -->
<script>
function toggleMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>

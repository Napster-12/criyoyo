<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Setup 2FA | CRIYOYO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html, body{
    width:100%;
    overflow-x:hidden;
}

body{
    background:#000;
    color:#fff;
}

.container{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:0 20px;
}

.navbar{
    background:#000;
    border-bottom:1px solid #111;
    position:sticky;
    top:0;
    z-index:999;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 0;
}

.logo{
    font-size:1.5rem;
    font-weight:700;
    color:#00ff88;
    text-decoration:none;
}

.nav-links{
    display:flex;
    gap:20px;
    align-items:center;
}

.nav-links a{
    color:#fff;
    text-decoration:none;
    font-size:0.95rem;
    transition:0.3s;
}

.nav-links a:hover{
    color:#00ff88;
}

.hamburger{
    display:none;
    font-size:1.8rem;
    cursor:pointer;
    color:#00ff88;
}

.cart-count{
    background:#fff;
    color:#000;
    border-radius:50%;
    width:18px;
    height:18px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    font-size:0.7rem;
    font-weight:700;
}

.cart-btn{
    background:#00ff88;
    color:#000 !important;
    padding:10px 16px;
    border-radius:6px;
    font-weight:600;
    text-decoration:none;
    display:inline-flex;
    align-items:center;
    gap:6px;
}

.mobile-menu{
    display:none;
    flex-direction:column;
    gap:15px;
    padding:15px 0;
    border-top:1px solid #111;
}

.mobile-menu a{
    color:#fff;
    text-decoration:none;
    font-size:1.05rem;
}

.mobile-menu a:hover{
    color:#00ff88;
}

.setup-section{
    min-height:calc(100vh - 80px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:60px 20px;
}

.setup-card{
    width:100%;
    max-width:500px;
    background:#0a0a0a;
    border:1px solid #111;
    border-radius:18px;
    padding:40px;
    transition:0.3s;
}

.setup-card:hover{
    border-color:#00ff88;
    box-shadow:0 10px 30px rgba(0,255,136,0.08);
}

.setup-card h1{
    font-size:2rem;
    margin-bottom:10px;
}

.setup-card p{
    color:#aaa;
    margin-bottom:30px;
    line-height:1.6;
}

.qr-container{
    background:#111;
    padding:20px;
    border-radius:8px;
    margin-bottom:20px;
    text-align:center;
}

.qr-container img{
    max-width:100%;
    height:auto;
}

.secret-code{
    background:#111;
    padding:15px;
    border-radius:8px;
    margin-bottom:20px;
    word-break:break-all;
    font-family:monospace;
    color:#00ff88;
    text-align:center;
}

.btn{
    display:inline-block;
    width:100%;
    padding:14px;
    background:#00ff88;
    border:none;
    border-radius:8px;
    color:#000;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    text-decoration:none;
    text-align:center;
    transition:0.3s;
}

.btn:hover{
    background:#00cc6a;
}

@media screen and (max-width:768px){

    .nav-links{
        display:none;
    }

    .hamburger{
        display:block;
    }

    .mobile-menu.active{
        display:flex;
    }

    .setup-section{
        padding:40px 15px;
    }

    .setup-card{
        padding:28px;
    }

    .setup-card h1{
        font-size:1.8rem;
    }
}

</style>
</head>

<body>

{% include 'partials/navbar.html' %}

<section class="setup-section">

    <div class="setup-card">

        <h1>Setup Two-Factor Authentication</h1>

        <p>
            Scan the QR code below with your Google Authenticator app,
            or manually enter the secret key.
        </p>

        <div class="qr-container">
            <img src="data:image/png;base64,{{ qr_code }}" alt="QR Code">
        </div>

        <p style="margin-bottom:10px;">Manual Entry Secret:</p>

        <div class="secret-code">{{ secret }}</div>

        <p style="margin-top:20px; font-size:0.9rem; color:#666;">
            After scanning, go to <a href="/login" style="color:#00ff88;">Login</a> to test your setup.
        </p>

    </div>

</section>

<script>
function toggleMenu(){
    document.getElementById("mobileMenu").classList.toggle("active");
}
</script>

</body>
</html>
